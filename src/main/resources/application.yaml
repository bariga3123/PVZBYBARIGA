spring:
  datasource:
    url: jdbc:h2:file:./pvzdb        # ← file вместо mem
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update               # ← update вместо create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never                    # ← data.sql выполнится только один раз
  thymeleaf:
    cache: false