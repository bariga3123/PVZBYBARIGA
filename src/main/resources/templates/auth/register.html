<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — ПВЗ-Система</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f9;
            color: #212529;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: #0d6efd; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Шапка */
        .navbar {
            background: #1f2937;
            color: #fff;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
        }
        .nav-menu a {
            color: #d1d5db;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            transition: background 0.15s, color 0.15s;
        }
        .nav-menu a:hover {
            background: #374151;
            color: #fff;
            text-decoration: none;
        }

        /* Контейнер */
        .container-narrow {
            max-width: 480px;
            margin: 60px auto;
            padding: 0 24px;
        }

        /* Карточка */
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card-body { padding: 28px; }
        .card-title {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            color: #1f2937;
        }

        /* Формы */
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
        }
        .form-control.is-invalid { border-color: #dc3545; }
        .invalid-feedback {
            display: block;
            color: #dc3545;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Кнопки */
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }
        .btn-success {
            background: #198754;
            color: #fff;
        }
        .btn-block { width: 100%; }
        .btn:hover { opacity: 0.9; }

        /* Футер */
        .footer {
            background: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: auto;
        }
        .footer small { color: #6b7280; }

        hr { border: none; border-top: 1px solid #e5e7eb; margin: 24px 0 16px; }

        .text-center { text-align: center; }
    </style>
</head>
<body>

<!-- Шапка -->
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">📦 ПВЗ-Система</a>
    <ul class="nav-menu">
        <li><a th:href="@{/}">Главная</a></li>
        <li><a th:href="@{/catalog}">Каталог</a></li>
        <li><a th:href="@{/contacts}">Контакты</a></li>
        <li><a th:href="@{/faq}">FAQ</a></li>
    </ul>
</nav>

<!-- Карточка регистрации -->
<div class="container-narrow">
    <div class="card">
        <div class="card-body">
            <h3 class="card-title">Регистрация</h3>

            <form th:action="@{/register}" th:object="${dto}" method="post">

                <div class="form-group">
                    <label for="username" class="form-label">Логин *</label>
                    <input type="text" th:field="*{username}" id="username"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}"></div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email *</label>
                    <input type="email" th:field="*{email}" id="email"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Телефон</label>
                    <input type="text" th:field="*{phone}" id="phone"
                           class="form-control" placeholder="+7-900-000-00-00"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Пароль * (от 6 символов)</label>
                    <input type="password" th:field="*{password}" id="password"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Подтверждение пароля *</label>
                    <input type="password" th:field="*{confirmPassword}" id="confirmPassword"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-success btn-block">Зарегистрироваться</button>
            </form>

            <hr>
            <p class="text-center">
                Уже есть аккаунт?
                <a th:href="@{/login}">Войти</a>
            </p>
        </div>
    </div>
</div>

<!-- Футер -->
<footer class="footer">
    <p>© 2026 ПВЗ-Система. Информационно-справочная система пункта выдачи заказов.</p>
    <small>Учебный проект. Spring Boot + Thymeleaf + H2</small>
</footer>

</body>
</html>
