<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — ПВЗ-Система</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f9;
            color: #212529;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: #0d6efd; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Шапка */
        .navbar {
            background: #1f2937;
            color: #fff;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
        }
        .nav-menu a {
            color: #d1d5db;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            transition: background 0.15s, color 0.15s;
        }
        .nav-menu a:hover {
            background: #374151;
            color: #fff;
            text-decoration: none;
        }

        /* Контейнер */
        .container-narrow {
            max-width: 460px;
            margin: 60px auto;
            padding: 0 24px;
        }

        /* Карточка */
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card-body { padding: 28px; }
        .card-title {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            color: #1f2937;
        }

        /* Форма */
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
        }

        /* Кнопки */
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }
        .btn-primary { background: #0d6efd; color: #fff; }
        .btn-block { width: 100%; }
        .btn:hover { opacity: 0.9; }

        /* Алерты */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            border-left: 4px solid;
        }
        .alert-danger { background: #f8d7da; color: #58151c; border-color: #dc3545; }
        .alert-info   { background: #cfe2ff; color: #052c65; border-color: #0d6efd; }

        /* Футер */
        .footer {
            background: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: auto;
        }
        .footer small { color: #6b7280; }

        hr { border: none; border-top: 1px solid #e5e7eb; margin: 24px 0 16px; }
        .text-center { text-align: center; }
        .text-muted { color: #6b7280; font-size: 14px; }
        .mt-3 { margin-top: 16px; }
    </style>
</head>
<body>

<!-- Шапка -->
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">📦 ПВЗ-Система</a>
    <ul class="nav-menu">
        <li><a th:href="@{/}">Главная</a></li>
        <li><a th:href="@{/catalog}">Каталог</a></li>
        <li><a th:href="@{/contacts}">Контакты</a></li>
        <li><a th:href="@{/faq}">FAQ</a></li>
    </ul>
</nav>

<!-- Карточка входа -->
<div class="container-narrow">
    <div class="card">
        <div class="card-body">
            <h3 class="card-title">Вход в систему</h3>

            <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
            <div th:if="${logoutMessage}" class="alert alert-info" th:text="${logoutMessage}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Логин</label>
                    <input type="text" id="username" name="username"
                           class="form-control" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" id="password" name="password"
                           class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Войти</button>
            </form>

            <hr>
            <p class="text-center">
                Нет аккаунта?
                <a th:href="@{/register}">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <p class="text-center text-muted mt-3">
        Тестовые логины: <code>admin / admin123</code>, <code>user / user123</code>
    </p>
</div>

<!-- Футер -->
<footer class="footer">
    <p>© 2026 ПВЗ-Система. Информационно-справочная система пункта выдачи заказов.</p>
    <small>Учебный проект. Spring Boot + Thymeleaf + H2</small>
</footer>

</body>
</html>
