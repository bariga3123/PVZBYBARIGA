<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Посылка')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container">
    <a th:href="@{/admin/parcels}" class="text-muted">← К списку</a>

    <div class="card mt-3" style="max-width:640px;margin:16px auto 0;">
        <div class="card-body">
            <h3 class="card-title"
                th:text="${id == null ? 'Новая посылка' : 'Редактирование посылки'}"></h3>

            <form th:action="@{/admin/parcels/save}" th:object="${dto}" method="post">
                <input type="hidden" name="id" th:value="${id}"/>

                <div class="form-group">
                    <label class="form-label">Трек-номер *</label>
                    <input type="text" th:field="*{trackingNumber}" class="form-control"
                           th:classappend="${#fields.hasErrors('trackingNumber')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('trackingNumber')}"
                         th:errors="*{trackingNumber}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea th:field="*{description}" rows="2" class="form-control"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}"></div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div class="form-group">
                        <label class="form-label">Вес (кг)</label>
                        <input type="number" step="0.01" th:field="*{weight}" class="form-control"
                               th:classappend="${#fields.hasErrors('weight')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('weight')}"
                             th:errors="*{weight}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Дата поступления *</label>
                        <input type="date" th:field="*{arrivalDate}" class="form-control"
                               th:classappend="${#fields.hasErrors('arrivalDate')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('arrivalDate')}"
                             th:errors="*{arrivalDate}"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Хранить до</label>
                    <input type="date" th:field="*{storageUntil}" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Получатель *</label>
                    <select th:field="*{customerId}" class="form-control"
                            th:classappend="${#fields.hasErrors('customerId')} ? 'is-invalid'">
                        <option value="">— выберите получателя —</option>
                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.fullName}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('customerId')}"
                         th:errors="*{customerId}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Услуга</label>
                    <select th:field="*{serviceId}" class="form-control">
                        <option value="">— не выбрана —</option>
                        <option th:each="s : ${services}"
                                th:value="${s.id}"
                                th:text="${s.name + ' (' + s.price + ' ₽)'}"></option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
