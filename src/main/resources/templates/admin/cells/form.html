<!-- admin/cells/form.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Ячейка')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<div class="container">
    <a th:href="@{/admin/cells}" class="text-muted">← К списку</a>
    <div class="card mt-3" style="max-width:520px;margin:16px auto 0;">
        <div class="card-body">
            <h3 class="card-title"
                th:text="${id == null ? 'Новая ячейка' : 'Редактирование ячейки'}"></h3>
            <form th:action="@{/admin/cells/save}" th:object="${dto}" method="post">
                <input type="hidden" name="id" th:value="${id}"/>

                <div class="form-group">
                    <label class="form-label">Номер *</label>
                    <input type="text" th:field="*{cellNumber}" class="form-control"
                           th:classappend="${#fields.hasErrors('cellNumber')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cellNumber')}"
                         th:errors="*{cellNumber}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Размер *</label>
                    <select th:field="*{size}" class="form-control">
                        <option th:each="s : ${sizes}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <input type="checkbox" th:field="*{isOccupied}"/> Занята
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
