<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Получатели')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container">
    <a th:href="@{/admin/dashboard}" class="text-muted">← В админку</a>

    <div class="d-flex justify-between align-center mt-3 mb-4">
        <h1>👥 Получатели</h1>
        <a th:href="@{/admin/customers/new}" class="btn btn-primary">+ Добавить</a>
    </div>

    <div th:if="${items.isEmpty()}" class="alert alert-info">Получателей нет.</div>

    <div class="card" th:unless="${items.isEmpty()}">
        <table class="table mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>ФИО</th>
                <th>Телефон</th>
                <th>Адрес</th>
                <th>Пользователь</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${items}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.fullName}"></td>
                <td th:text="${c.phone != null ? c.phone : '—'}"></td>
                <td th:text="${c.address != null ? c.address : '—'}"></td>
                <td th:text="${c.user != null ? c.user.username : '—'}"></td>
                <td>
                    <a th:href="@{'/admin/customers/' + ${c.id} + '/edit'}"
                       class="btn btn-primary btn-sm">✏️</a>
                    <form th:action="@{'/admin/customers/' + ${c.id} + '/delete'}"
                          method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Удалить получателя?');">🗑</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
