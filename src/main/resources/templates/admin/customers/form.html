<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Получатель')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container">
    <a th:href="@{/admin/customers}" class="text-muted">← К списку</a>

    <div class="card mt-3" style="max-width:560px;margin:16px auto 0;">
        <div class="card-body">
            <h3 class="card-title"
                th:text="${id == null ? 'Новый получатель' : 'Редактирование получателя'}"></h3>

            <form th:action="@{/admin/customers/save}" th:object="${dto}" method="post">
                <input type="hidden" name="id" th:value="${id}"/>

                <div class="form-group">
                    <label class="form-label">ФИО *</label>
                    <input type="text" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Телефон</label>
                    <input type="text" th:field="*{phone}" class="form-control"
                           placeholder="+7-900-000-00-00"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Адрес</label>
                    <input type="text" th:field="*{address}" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Пользователь *</label>
                    <select th:field="*{userId}" class="form-control"
                            th:classappend="${#fields.hasErrors('userId')} ? 'is-invalid'">
                        <option value="">— выберите пользователя —</option>
                        <option th:each="u : ${users}"
                                th:value="${u.id}"
                                th:text="${u.username + ' (' + u.email + ')'}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('userId')}"
                         th:errors="*{userId}"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
