<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">ПВЗ-Система</title>

    <style>
        /* ===================== ОБЩИЕ СТИЛИ ===================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f9;
            color: #212529;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: #0d6efd;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* ===================== ШАПКА ===================== */
        .navbar {
            background: #1f2937;
            color: #fff;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .navbar-brand {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
        }
        .navbar-brand:hover {
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-menu a {
            color: #d1d5db;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }
        .nav-menu a:hover {
            background: #374151;
            color: #fff;
            text-decoration: none;
        }

        .nav-user {
            color: #fbbf24;
            font-weight: 600;
            padding: 8px 12px;
            font-size: 14px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===================== КНОПКИ ===================== */
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.15s, opacity 0.15s;
        }
        .btn:hover {
            text-decoration: none;
            opacity: 0.9;
        }

        .btn-primary   { background: #0d6efd; color: #fff; }
        .btn-success   { background: #198754; color: #fff; }
        .btn-danger    { background: #dc3545; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-outline   { background: transparent; color: #fff; border: 1px solid #6b7280; }
        .btn-outline:hover { background: #374151; }
        .btn-sm        { padding: 6px 12px; font-size: 13px; }
        .btn-block     { width: 100%; }

        /* ===================== КОНТЕЙНЕР ===================== */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .container-narrow {
            max-width: 460px;
            margin: 60px auto;
            padding: 0 24px;
        }

        /* ===================== КАРТОЧКА ===================== */
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .card-body {
            padding: 28px;
        }

        .card-title {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            color: #1f2937;
        }

        /* ===================== ФОРМЫ ===================== */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
        }

        .form-control.is-invalid {
            border-color: #dc3545;
        }
        .form-control.is-invalid:focus {
            box-shadow: 0 0 0 3px rgba(220,53,69,0.15);
        }

        .invalid-feedback {
            display: block;
            color: #dc3545;
            font-size: 13px;
            margin-top: 4px;
        }

        /* ===================== АЛЕРТЫ ===================== */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            border-left: 4px solid;
        }
        .alert-success {
            background: #d1e7dd;
            color: #0a3622;
            border-color: #198754;
        }
        .alert-danger {
            background: #f8d7da;
            color: #58151c;
            border-color: #dc3545;
        }
        .alert-info {
            background: #cfe2ff;
            color: #052c65;
            border-color: #0d6efd;
        }
        .alert-warning {
            background: #fff3cd;
            color: #664d03;
            border-color: #ffc107;
        }

        /* ===================== ФУТЕР ===================== */
        .footer {
            background: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: auto;
        }
        .footer small {
            color: #6b7280;
        }

        /* ===================== ГЕРОЙ (главная) ===================== */
        .hero {
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            color: #fff;
            padding: 60px 40px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(13,110,253,0.25);
        }
        .hero h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }
        .hero p {
            font-size: 17px;
            margin-bottom: 20px;
            opacity: 0.95;
        }

        /* ===================== ТАБЛИЦА ===================== */
        .table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .table th, .table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }
        .table th {
            background: #f9fafb;
            font-weight: 600;
            color: #374151;
        }
        .table tr:last-child td {
            border-bottom: none;
        }
        .table tr:hover td {
            background: #f9fafb;
        }

        /* ===================== БЕЙДЖИ СТАТУСОВ ===================== */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-new         { background: #cfe2ff; color: #052c65; }
        .badge-in_progress { background: #fff3cd; color: #664d03; }
        .badge-completed   { background: #d1e7dd; color: #0a3622; }
        .badge-rejected    { background: #f8d7da; color: #58151c; }

        /* ===================== УТИЛИТЫ ===================== */
        .text-center { text-align: center; }
        .text-muted  { color: #6b7280; font-size: 14px; }
        .mt-3 { margin-top: 16px; }
        .mt-4 { margin-top: 24px; }
        .mt-5 { margin-top: 40px; }
        .mb-3 { margin-bottom: 16px; }
        .mb-4 { margin-bottom: 24px; }
        .d-flex { display: flex; }
        .gap-2 { gap: 8px; }
        .justify-between { justify-content: space-between; }
        .align-center { align-items: center; }
    </style>
</head>
<body>

<!-- ================== NAVBAR ================== -->
<nav th:fragment="navbar" class="navbar">
    <a class="navbar-brand" th:href="@{/}">📦 ПВЗ-Система</a>

    <ul class="nav-menu">
        <li><a th:href="@{/}">Главная</a></li>
        <li><a th:href="@{/catalog}">Каталог</a></li>
        <li><a th:href="@{/contacts}">Контакты</a></li>
        <li><a th:href="@{/faq}">FAQ</a></li>

        <li sec:authorize="hasAnyRole('USER','ADMIN')">
            <a th:href="@{/requests}">Мои заявки</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/dashboard}">Админка</a>
        </li>
    </ul>

    <div class="nav-right">
        <span sec:authorize="isAnonymous()">
            <a class="btn btn-outline btn-sm" th:href="@{/login}">Войти</a>
            <a class="btn btn-primary btn-sm" th:href="@{/register}">Регистрация</a>
        </span>

        <span sec:authorize="isAuthenticated()">
            <a class="nav-user" th:href="@{/profile}">
                👤 <span sec:authentication="name"></span>
            </a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-outline btn-sm">Выйти</button>
            </form>
        </span>
    </div>
</nav>

</body>
</html>
