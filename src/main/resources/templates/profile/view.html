<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Мой профиль')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container">
    <div class="card" style="max-width:520px;margin:0 auto;">
        <div class="card-body">
            <h3 class="card-title">👤 Мой профиль</h3>

            <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e5e7eb;">
                <span class="text-muted">Логин</span>
                <b th:text="${user.username}"></b>
            </div>
            <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e5e7eb;">
                <span class="text-muted">Email</span>
                <b th:text="${user.email}"></b>
            </div>
            <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e5e7eb;">
                <span class="text-muted">Телефон</span>
                <b th:text="${user.phone != null ? user.phone : '— не указан —'}"></b>
            </div>
            <div style="display:flex;justify-content:space-between;padding:12px 0;">
                <span class="text-muted">Роль</span>
                <b th:text="${user.role}"></b>
            </div>

            <div class="mt-4">
                <a th:href="@{/profile/edit}" class="btn btn-primary">✏️ Редактировать профиль</a>
                <a th:href="@{/requests}" class="btn btn-secondary">📦 Мои заявки</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
