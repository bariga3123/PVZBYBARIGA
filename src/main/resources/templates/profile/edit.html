<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Редактирование профиля')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container">
    <a th:href="@{/profile}" class="text-muted">← Назад к профилю</a>

    <div class="card mt-3" style="max-width:520px;margin:16px auto 0;">
        <div class="card-body">
            <h3 class="card-title">✏️ Редактирование профиля</h3>

            <form th:action="@{/profile/edit}" th:object="${dto}" method="post">

                <!-- Глобальные ошибки — ВНУТРИ формы -->
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>

                <div class="form-group">
                    <label for="username" class="form-label">Логин</label>
                    <input type="text" th:field="*{username}" id="username"
                           class="form-control" readonly
                           style="background:#f3f4f6;cursor:not-allowed;">
                    <div class="text-muted" style="font-size:12px;margin-top:4px;">
                        Логин изменить нельзя
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email *</label>
                    <input type="email" th:field="*{email}" id="email"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Телефон</label>
                    <input type="text" th:field="*{phone}" id="phone"
                           class="form-control" placeholder="+7-900-000-00-00"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
