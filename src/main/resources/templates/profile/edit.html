<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой профиль — ПВЗ-Система</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f9;
            color: #212529;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: #0d6efd; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Шапка */
        .navbar {
            background: #1f2937;
            color: #fff;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .navbar-brand { color: #fff; font-size: 20px; font-weight: 700; }
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
        }
        .nav-menu a {
            color: #d1d5db;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
        }
        .nav-menu a:hover {
            background: #374151;
            color: #fff;
            text-decoration: none;
        }
        .nav-user { color: #fbbf24; font-weight: 600; padding: 8px 12px; font-size: 14px; }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover { opacity: 0.9; text-decoration: none; }
        .btn-primary   { background: #0d6efd; color: #fff; }
        .btn-danger    { background: #dc3545; color: #fff; }
        .btn-outline   { background: transparent; color: #fff; border: 1px solid #6b7280; }
        .btn-sm        { padding: 6px 12px; font-size: 13px; }
        .btn-block     { width: 100%; }

        /* Контейнер */
        .container {
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 24px;
        }

        /* Карточка */
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card-body { padding: 28px; }
        .card-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #1f2937;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .profile-row:last-child { border-bottom: none; }
        .profile-label { color: #6b7280; font-size: 14px; }
        .profile-value { font-weight: 500; color: #1f2937; }

        /* Алерты */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            border-left: 4px solid;
        }
        .alert-success { background: #d1e7dd; color: #0a3622; border-color: #198754; }
        .alert-info    { background: #cfe2ff; color: #052c65; border-color: #0d6efd; }

        /* Футер */
        .footer {
            background: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: auto;
        }
        .footer small { color: #6b7280; }

        .mt-4 { margin-top: 24px; }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">📦 ПВЗ-Система</a>
    <ul class="nav-menu">
        <li><a th:href="@{/}">Главная</a></li>
        <li><a th:href="@{/catalog}">Каталог</a></li>
        <li><a th:href="@{/requests}">Мои заявки</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin/dashboard}">Админка</a></li>
    </ul>
    <div style="display:flex;align-items:center;gap:8px;">
        <span class="nav-user">👤 <span sec:authentication="name"></span></span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-outline btn-sm">Выйти</button>
        </form>
    </div>
</nav>

<div class="container">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card">
        <div class="card-body">
            <h3 class="card-title">👤 Мой профиль</h3>

            <div class="profile-row">
                <span class="profile-label">Логин</span>
                <span class="profile-value" th:text="${user.username}"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Email</span>
                <span class="profile-value" th:text="${user.email}"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Телефон</span>
                <span class="profile-value"
                      th:text="${user.phone != null ? user.phone : '— не указан —'}"></span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Роль</span>
                <span class="profile-value" th:text="${user.role}"></span>
            </div>

            <div class="mt-4">
                <a th:href="@{/profile/edit}" class="btn btn-primary">✏️ Редактировать профиль</a>
                <a th:href="@{/}" class="btn btn-outline" style="color:#6b7280;border-color:#d1d5db;">На главную</a>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <p>© 2026 ПВЗ-Система. Информационно-справочная система пункта выдачи заказов.</p>
    <small>Учебный проект. Spring Boot + Thymeleaf + H2</small>
</footer>

</body>
</html>
